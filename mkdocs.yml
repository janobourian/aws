site_name: AWS Learning Process
theme:
  name: material
  palette:
    scheme: slate
    primary: deep purple
    accent: deep orange
  font:
    text: Roboto
    code: Roboto Mono
  logo: images/logo.png
  favicon: images/favicon.png

use_directory_urls: false
docs_dir: docs

nav:
  - Home: index.md
  - AWS Solution Architect: 
    - Overview: solution_architect/solution-architect.md
    - Identity and Access Management: solution_architect/iam.md
    - Elastic Compute Cloud: solution_architect/ec2.md
    - Classic Solutions Architecture Discussions: solution_architect/classic-solutions-architecture-discussions.md
    - Decoupling Applications: solution_architect/decoupling-applications.md
    - Serverless Solution Architectures: solution_architect/serverless-solution-architectures.md
    - Data and Analytics: solution_architect/data-and-analytics.md
    - Machine Learning: solution_architect/machine-learning.md
    - More Solution Architectures: solution_architect/more-solution-architectures.md
  - AWS SysOps Administrator: 
    - Overview: sysops/sysops-administrator.md
    - CloudFormation: sysops/cloudformation.md
    - Virtual Private Cloud: sysops/virtual-private-cloud.md
  - Cloud Development Kit:
    - Overview: cdk/overview.md
    - Getting Started: cdk/getting-started.md
    - Best Practices: cdk/best-practices.md
    - Examples: cdk/examples.md
    - Trouble Shooting: cdk/trouble-shooting.md
  - CloudFormation:
    - Overview: cloudformation/overview.md
    - Getting Started: cloudformation/getting-started.md
    - Best Practices: cloudformation/best-practices.md
    - Examples: cloudformation/examples.md
  - AWS DevOps:
    - Overview: devops/overview.md
    - Getting Started: devops/getting-started.md
    - Continuous Integration and Continuous Delivery: devops/cicd.md
    - Continuous Deployment: devops/cd.md
    - Infrastructure as Code: devops/iac.md
    - Automation and tooling: devops/automation-and-tooling.md
    - Continuous Monitoring: devops/cm.md
    - Security: devops/security.md
  - AWS Virtual Private Cloud:
    - Overview: vpc/overview.md
    - Getting Started: vpc/getting-started.md
    - Best Practices: vpc/best-practices.md
    - Examples: vpc/examples.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - sane_lists
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search
  - tags

extra:
  generator: false